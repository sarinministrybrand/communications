/* =========================================================================
   EVENTS
   ========================================================================= */
var searchTimer = null, peopleTimer = null, inboxTimer = null;
function bindDynamic(){
  var q = document.getElementById('q');
  if(q){
    q.addEventListener('input', function(){
      S.query = q.value; S.highlight = -1;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async function(){
        if(S.query.trim().length >= 2){
          try{ S.qResults = (await API.get('/people?q=' + encodeURIComponent(S.query.trim()) + '&size=8')).people || []; }
          catch(e){ S.qResults = []; }
        } else S.qResults = [];
        redrawResults();
      }, 180);
      redrawResults();
    });
    q.addEventListener('keydown', onQueryKey);
    if(S.query){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  var iq = document.getElementById('inboxQ');
  if(iq){
    iq.addEventListener('input', function(){
      S.inboxQ = iq.value;
      clearTimeout(inboxTimer);
      // 250ms: long enough not to query on every keystroke, short enough that
      // the list feels like it is filtering rather than loading.
      inboxTimer = setTimeout(function(){ load('replies'); }, 250);
    });
    if(S.inboxQ){ iq.focus(); iq.setSelectionRange(iq.value.length, iq.value.length); }
  }
  var msg = document.getElementById('msg');
  if(msg){
    msg.addEventListener('input', function(){
      S.text = msg.value; paintTail();
      clearTimeout(msg._t); msg._t = setTimeout(refreshCost, 220);
      // Autosave. A legacy NPS complaint was losing typed text to a refresh;
      // someone who writes to 1,240 people should never retype a word.
      clearTimeout(S.autosaveTimer);
      S.autosaveTimer = setTimeout(saveDraft, 1500);
    });
  }
  var rep = document.getElementById('reply');
  if(rep){
    rep.addEventListener('input', function(){
      S.replyText = rep.value;
      rep.style.height = 'auto'; rep.style.height = Math.min(120, rep.scrollHeight) + 'px';
      var b = document.querySelector('[data-act="sendReply"]');
      if(b) b.disabled = !S.replyText.trim() || S.replying;
      BRIDGE.measure();
    });
    rep.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendReply(); }
    });
    rep.focus();
  }
  var ps = document.getElementById('psearch');
  if(ps){
    ps.addEventListener('input', function(){
      S.peopleQ = ps.value;
      clearTimeout(peopleTimer);
      peopleTimer = setTimeout(async function(){
        S.people.page = 1;
        await loadPeople(); render();
      }, 260);
    });
    if(S.peopleQ){ ps.focus(); ps.setSelectionRange(ps.value.length, ps.value.length); }
  }
}
function redrawResults(){
  var el = document.getElementById('results');
  if(el){ el.innerHTML = resultsHtml(); BRIDGE.measure(); }
}
function onQueryKey(e){
  var rows = document.querySelectorAll('#results .res');
  if(e.key === 'ArrowDown'){ e.preventDefault(); S.highlight = Math.min(rows.length - 1, S.highlight + 1); redrawResults(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); S.highlight = Math.max(-1, S.highlight - 1); redrawResults(); }
  else if(e.key === 'Enter' && S.highlight > -1){
    e.preventDefault();
    var el = rows[S.highlight];
    if(el) pick(el.dataset.kind, el.dataset.id);
  }
  else if(e.key === 'Backspace' && !S.query && S.audience.length){
    var last = S.audience[S.audience.length - 1];
    if(!last.locked){ S.audience.pop(); refreshCost(); render(); }
  }
  else if(e.key === 'Escape'){ S.query = ''; S.qResults = []; S.highlight = -1; render(); }
}
function pick(kind, id){
  var src = kind === 'group' ? S.groups : S.qResults;
  var o = src.filter(function(x){ return String(x.id) === String(id); })[0];
  if(!o) return;
  S.audience.push({kind:kind, id:String(o.id), name:o.name,
                   count: kind === 'group' ? o.count : 1, locked:false});
  S.query = ''; S.qResults = []; S.highlight = -1;
  refreshCost(); render();
  BRIDGE.send('recipientsChanged', {recipients:S.audience, reach:reach()});
}

// The section key stayed 'replies' so existing host integrations keep working,
// but the label is now Inbox. Accept both from a host rather than making anyone
// remember which one this build wants.
function viewKey(v){ return v === 'inbox' ? 'replies' : v; }

async function go(view){
  S.navOpen = false;
  S.view = view;
  S.openMessage = null; S.openThread = null; S.openPerson = null; S.openGroup = null;
  S.loadingDetail = null;
  render();
  try{ await load(); }catch(e){ toast(e.message || 'Could not load'); }
  render();
  BRIDGE.send('viewChanged', {view:view});
}

async function sendReply(){
  var body = S.replyText.trim();
  if(!body || S.replying || !S.openThread) return;
  S.replying = true;
  var b = document.querySelector('[data-act="sendReply"]'); if(b) b.disabled = true;
  try{
    await API.post('/threads/' + S.openThread.id + '/reply', {body:body});
    S.replyText = '';
    S.openThread = await API.get('/threads/' + S.openThread.id);
    S.cfg = await API.get('/bootstrap');
    BRIDGE.send('replied', {threadId:S.openThread.id, personId:S.openThread.person_id});
  }catch(err){ toast(err.message || 'Could not send reply'); }
  S.replying = false; render();
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 3300);
}

async function guard(fn){
  if(S.busy) return;
  S.busy = true;
  try { await fn(); } catch(err){ toast(err.message || 'Something went wrong'); }
  S.busy = false;
}

document.addEventListener('click', function(e){
  if(S.navOpen && !e.target.closest('#topnav')){ S.navOpen = false; fitNav(); }
}, true);

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if(!t) return;
  var a = t.dataset.act, id = t.dataset.id;

  if(a === 'nav')            return go(t.dataset.v);
  if(a === 'tileNav'){
    var to = t.dataset.to.split(':');
    if(to[0] === 'reports'){ S.report = to[1]; return go('reports'); }
    return go(to[0]);
  }
  if(a === 'pick')           return pick(t.dataset.kind, id);
  if(a === 'unpick'){        S.audience.splice(+t.dataset.i, 1); refreshCost(); return render(); }
  if(a === 'chan'){
    var k = t.dataset.k, i = S.channels.indexOf(k);
    if(i > -1) S.channels.splice(i, 1); else S.channels.push(k);
    refreshCost(); return render();
  }
  if(a === 'send')           return doSend();
  if(a === 'emergency'){     S.emergency = true; S.channels = gate(['text','voice']); refreshCost(); return render(); }
  if(a === 'unemergency'){   S.emergency = false; refreshCost(); return render(); }
  if(a === 'emergencyFromDash'){
    S.emergency = true; S.channels = gate(['text','voice']);
    S.view = 'compose'; render(); return;
  }
  if(a === 'undo')           return doUndo();

  if(a === 'openMsg'){
    S.view = 'sent'; S.openMessage = null; S.openPerson = null; S.openGroup = null;
    S.loadingDetail = +id; render();
    return API.get('/messages/' + id).then(function(m){
      S.loadingDetail = null; S.openMessage = m; render();
    }).catch(function(err){ S.loadingDetail = null; toast(err.message); render(); });
  }
  if(a === 'closeMsg'){ S.openMessage = null; return guard(async function(){ await load(); render(); }); }

  if(a === 'runHealth'){
    if(S.checking) return;
    S.checking = true; render();
    return guard(async function(){
      try{ await API.post('/health/check', {}); }
      finally{
        S.checking = false;
        S.health = await API.get('/health');
        render();
      }
    });
  }
  if(a === 'navMore'){
    S.navOpen = !S.navOpen; fitNav();
    return;
  }
  if(a === 'inboxTab'){
    S.inboxState = t.dataset.k; S.threads = []; render();
    return load('replies');
  }
  if(a === 'assignThread'){
    return guard(async function(){
      await API.post('/inbox/' + id + '/assign', {staff_id: t.value || null});
      S.openThread = await API.get('/threads/' + id);
      toast(t.value ? 'Assigned' : 'Unassigned'); render();
    });
  }
  if(a === 'threadState'){
    return guard(async function(){
      await API.post('/inbox/' + id + '/state', {state: t.dataset.state});
      S.openThread = await API.get('/threads/' + id);
      toast(t.dataset.state === 'done' ? 'Marked done' : 'Reopened'); render();
    });
  }
  if(a === 'reviewThread'){
    return guard(async function(){
      var act = t.dataset.action;
      await API.post('/inbox/' + id + '/review', {action: act});
      S.openThread = await API.get('/threads/' + id);
      toast(act === 'optout' ? 'Opted out of text' : 'Left subscribed');
      render();
    });
  }
  if(a === 'openThread' || a === 'openThreadId'){
    S.view = 'replies'; S.openMessage = null; S.openPerson = null;
    return guard(async function(){
      S.openThread = await API.get('/threads/' + id);
      S.replyText = ''; S.cfg = await API.get('/bootstrap'); render();
    });
  }
  if(a === 'closeThread'){ S.openThread = null; S.replyText = ''; return guard(async function(){ await load(); render(); }); }
  if(a === 'sendReply')      return sendReply();

  if(a === 'openPerson'){
    S.view = 'people'; S.openMessage = null; S.openThread = null; S.openGroup = null;
    return guard(async function(){ S.openPerson = await API.get('/people/' + id); render(); });
  }
  if(a === 'closePerson'){ S.openPerson = null; return guard(async function(){ await loadPeople(); render(); }); }
  if(a === 'peopleFilter'){
    S.peopleFilter = t.dataset.f || ''; S.peopleGroup = ''; S.people.page = 1;
    if(!t.dataset.f) S.peopleQ = '';
    return guard(async function(){ await loadPeople(); render(); });
  }
  if(a === 'peopleInGroup'){
    S.view = 'people'; S.openGroup = null; S.openPerson = null;
    S.peopleGroup = id; S.peopleFilter = ''; S.peopleQ = ''; S.people.page = 1;
    return guard(async function(){ await loadPeople(); render(); });
  }
  if(a === 'pPage'){
    var p = +t.dataset.p;
    if(p < 1 || p > S.people.pages) return;
    S.people.page = p;
    return guard(async function(){ await loadPeople(); render(); });
  }
  if(a === 'toggleOptOut'){
    var c = t.dataset.c, cur = S.openPerson.opted_out[c];
    return guard(async function(){
      var patch = {}; patch['opt_' + c] = !cur;
      await API.patch('/people/' + S.openPerson.id, patch);
      S.openPerson = await API.get('/people/' + S.openPerson.id);
      toast(cur ? CH[c] + ' turned back on' : 'Opted out of ' + CH[c].toLowerCase());
      render();
    });
  }
  if(a === 'archivePerson'){
    var p2 = S.openPerson;
    return guard(async function(){
      if(p2.archived) await API.patch('/people/' + p2.id, {archived:false});
      else await API.del('/people/' + p2.id);
      S.openPerson = await API.get('/people/' + p2.id);
      toast(p2.archived ? 'Restored' : 'Archived');
      render();
    });
  }
  if(a === 'messagePerson'){
    S.audience = [{kind:'person', id:String(id), name:t.dataset.name, count:1, locked:false}];
    S.openPerson = null; refreshCost(); return go('compose');
  }
  if(a === 'messageGroup'){
    S.audience = [{kind:'group', id:String(id), name:t.dataset.name,
                   count:+t.dataset.count || 0, locked:false}];
    S.openGroup = null; refreshCost(); return go('compose');
  }
  if(a === 'editPerson')     return editPersonModal();
  if(a === 'addPerson')      return addPersonModal();

  if(a === 'openGroup'){
    S.view = 'groups'; S.openPerson = null; S.openMessage = null;
    return guard(async function(){ S.openGroup = await API.get('/groups/' + id); render(); });
  }
  if(a === 'closeGroup'){ S.openGroup = null; return guard(async function(){
    S.groups = (await API.get('/groups')).groups || []; render(); }); }
  if(a === 'addGroup')       return addGroupModal();
  if(a === 'renameGroup')    return renameGroupModal();
  if(a === 'deleteGroup')    return deleteGroupModal();
  if(a === 'removeMember'){
    var gid = S.openGroup.id;
    return guard(async function(){
      await API.del('/groups/' + gid + '/members', {person_ids:[+id]});
      S.openGroup = await API.get('/groups/' + gid);
      toast('Removed from group'); render();
    });
  }

  // ---- keywords
  if(a === 'addKeyword')     return keywordModal();
  if(a === 'toggleKeyword'){
    return guard(async function(){
      await API.patch('/keywords/' + id, {active: t.dataset.on !== '1'});
      S.keywords = (await API.get('/keywords')).keywords || [];
      toast(t.dataset.on === '1' ? 'Keyword paused' : 'Keyword active'); render();
    });
  }
  if(a === 'deleteKeyword'){
    return showModal('Delete the keyword ' + t.dataset.w + '?',
      '<p style="margin:0;color:var(--ink-2);font-size:13px">Anyone who already joined ' +
      'through it stays on the list. Anyone partway through its follow-up sequence stops ' +
      'receiving it.</p>', 'Delete keyword', function(){
        guard(async function(){
          await API.del('/keywords/' + id);
          closeModal();
          S.keywords = (await API.get('/keywords')).keywords || [];
          toast('Keyword deleted'); render();
        });
      });
  }
  if(a === 'simKeyword'){
    return guard(async function(){
      var r = await API.post('/simulate/keyword', {word: t.dataset.w});
      S.keywords = (await API.get('/keywords')).keywords || [];
      S.cfg = await API.get('/bootstrap');
      toast('Someone just texted ' + t.dataset.w + ' - see Replies');
      render();
    });
  }

  // ---- polls
  if(a === 'addPoll')        return pollModal();
  if(a === 'closePoll'){
    return guard(async function(){
      await API.post('/polls/' + id + '/close');
      S.polls = (await API.get('/polls')).polls || [];
      toast('Poll closed'); render();
    });
  }

  // ---- templates
  if(a === 'addTemplate')    return templateModal(null);
  if(a === 'editTemplate'){
    var tpl = S.templates.filter(function(x){ return String(x.id) === id; })[0];
    return templateModal(tpl);
  }
  if(a === 'deleteTemplate'){
    return showModal('Delete \u201C' + t.dataset.name + '\u201D?',
      '<p style="margin:0;color:var(--ink-2);font-size:13px">Messages already sent from ' +
      'this template are not affected.</p>', 'Delete template', function(){
        guard(async function(){
          await API.del('/templates/' + id);
          closeModal();
          var tr = await API.get('/templates');
          S.templates = tr.templates || []; S.templateCats = tr.categories || [];
          toast('Template deleted'); render();
        });
      });
  }
  if(a === 'useTemplate' || a === 'applyTemplate'){
    var tp = S.templates.filter(function(x){ return String(x.id) === id; })[0];
    if(!tp) return;
    S.text = tp.body; S.templateId = tp.id;
    S.channels = gate(tp.channels && tp.channels.length ? tp.channels : S.channels);
    closeModal();
    S.view = 'compose'; render(); refreshCost(); refreshPreview().then(render);
    toast('Template applied');
    return;
  }
  if(a === 'pickTemplate'){
    if(!S.templates.length) return toast('No templates saved yet');
    return showModal('Use a template',
      '<div class="list">' + S.templates.map(function(x){
        return '<div class="card" data-act="applyTemplate" data-id="' + x.id + '">' +
          '<div class="top"><b>' + esc(x.name) + '</b><time>' + esc(x.category || '') +
          '</time></div><div class="prev">' + esc(x.body) + '</div></div>';
      }).join('') + '</div>', 'Close', closeModal);
  }

  // ---- attachments
  if(a === 'attach'){
    return showModal('Attach a link',
      '<div class="field"><div class="lbl">Label</div>' +
      '<input type="text" id="aName" placeholder="e.g. Camp consent form"></div>' +
      '<div class="field"><div class="lbl">Link</div>' +
      '<input type="text" id="aUrl" placeholder="https://..."></div>' +
      '<div class="note"><span class="i">i</span><span>Texts carry a link, not a file. ' +
      'The link is appended to the message.</span></div>', 'Attach', function(){
        var nm = (document.getElementById('aName').value || '').trim();
        var url = (document.getElementById('aUrl').value || '').trim();
        if(!nm || !url) return toast('Give the link a label and an address');
        if(!/^https?:\/\//i.test(url)) return toast('Links must start with http:// or https://');
        S.attachments.push({name:nm.slice(0,60), url:url});
        closeModal(); render();
      });
  }
  if(a === 'unattach'){ S.attachments.splice(+t.dataset.i, 1); return render(); }

  // ---- schedule
  if(a === 'schedule'){
    var dflt = new Date(Date.now() + 36e5);
    var pad = function(x){ return String(x).padStart(2, '0'); };
    var local = dflt.getFullYear() + '-' + pad(dflt.getMonth() + 1) + '-' + pad(dflt.getDate()) +
                'T' + pad(dflt.getHours()) + ':' + pad(dflt.getMinutes());
    return showModal('Schedule this message',
      '<div class="field"><div class="lbl">Send at</div>' +
      '<input type="datetime-local" id="schedAt" value="' + local + '"></div>' +
      '<div class="note"><span class="i">i</span><span>Credits are reserved when you ' +
      'schedule and returned if you cancel.</span></div>', 'Schedule', function(){
        var v = document.getElementById('schedAt').value;
        if(!v) return toast('Pick a date and time');
        var when2 = new Date(v);
        if(isNaN(when2.getTime())) return toast('That is not a valid date');
        if(when2.getTime() < Date.now() + 60000)
          return toast('Pick a time at least a minute from now');
        S.scheduleAt = when2.toISOString();
        closeModal(); render();
      });
  }
  if(a === 'unschedule'){ S.scheduleAt = ''; return render(); }

  // ---- preview
  if(a === 'togglePreview'){
    S.showPreview = !S.showPreview;
    if(!S.showPreview){ S.preview = null; return render(); }
    return guard(async function(){ await refreshPreview(); render(); });
  }

  // ---- test send
  if(a === 'testSend'){
    return guard(async function(){
      S.testing = true;
      await API.post('/messages', {test:true, audience:S.audience, channels:S.channels,
                                   body:S.text, attachments:S.attachments});
      S.testing = false;
      toast('Test sent to ' + S.audience[0].name + ' only');
    });
  }

  // ---- drafts
  if(a === 'openDraft'){
    return guard(async function(){
      var dr = (S.drafts || []).filter(function(x){ return String(x.id) === id; })[0];
      if(!dr){ S.drafts = (await API.get('/drafts')).drafts || [];
               dr = S.drafts.filter(function(x){ return String(x.id) === id; })[0]; }
      if(!dr) return toast('That draft is gone');
      S.text = dr.body; S.draftId = dr.id; S.draftSavedAt = dr.created_at;
      S.channels = gate(dr.channels && dr.channels.length ? dr.channels : ['text']);
      S.audience = normalise(dr.audience || []);
      S.attachments = dr.attachments || [];
      S.view = 'compose'; render(); refreshCost();
    });
  }
  if(a === 'deleteDraft'){
    return guard(async function(){
      await API.del('/drafts/' + id);
      if(String(S.draftId) === id){ S.draftId = null; S.draftSavedAt = null; }
      S.drafts = (await API.get('/drafts')).drafts || [];
      toast('Draft discarded'); render();
    });
  }

  // ---- scheduled message actions
  if(a === 'sendNow'){
    return guard(async function(){
      await API.post('/messages/' + id + '/send-now');
      S.openMessage = await API.get('/messages/' + id);
      toast('Sending now'); render();
    });
  }
  if(a === 'cancelScheduled'){
    return guard(async function(){
      await API.post('/messages/' + id + '/cancel');
      S.openMessage = await API.get('/messages/' + id);
      S.cfg = await API.get('/bootstrap');
      toast('Cancelled, credits returned'); render();
    });
  }

  // ---- settings
  if(a === 'saveSettings'){
    return guard(async function(){
      await API.patch('/settings', {
        organizationName: document.getElementById('sName').value,
        callerId: document.getElementById('sCaller').value,
        replyTo: document.getElementById('sReply').value,
        timezone: document.getElementById('sTz').value
      });
      S.cfg = await API.get('/bootstrap');
      toast('Settings saved'); render();
    });
  }

  if(a === 'report'){ S.report = t.dataset.r; return guard(async function(){ await loadReport(); render(); }); }
  if(a === 'adays'){ S.analyticsDays = +t.dataset.d; return guard(async function(){
    S.analytics = await API.get('/analytics?days=' + S.analyticsDays); render(); }); }
});

document.addEventListener('keydown', function(e){
  var t = e.target.closest('[data-act="chan"],[data-act="toggleOptOut"]');
  if(t && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); t.click(); }
  if(e.key === 'Escape'){
    if(S.navOpen){ S.navOpen = false; fitNav(); document.getElementById('navMore').focus(); return; }
    if(document.getElementById('modal').innerHTML) closeModal();
  }
});

/* ---------------- modals ---------------- */
function addPersonModal(){
  showModal('Add a person',
    '<div class="field"><div class="lbl">Name</div><input type="text" id="fName" placeholder="Full name"></div>' +
    '<div class="two"><div class="field"><div class="lbl">Mobile</div><input type="tel" id="fPhone" placeholder="+1 555 0100"></div>' +
    '<div class="field"><div class="lbl">Email</div><input type="email" id="fEmail" placeholder="name@example.org"></div></div>' +
    '<div class="field"><div class="lbl">Add to group</div><select id="fGroup"><option value="">None</option>' +
    S.groups.map(function(g){ return '<option value="' + g.id + '">' + esc(g.name) + '</option>'; }).join('') +
    '</select></div>', 'Add person', function(){
      var body = {
        name: document.getElementById('fName').value,
        phone: document.getElementById('fPhone').value,
        email: document.getElementById('fEmail').value
      };
      var g = document.getElementById('fGroup').value;
      if(g) body.group_ids = [+g];
      guard(async function(){
        await API.post('/people', body);
        closeModal(); toast('Person added');
        S.people.page = 1; await loadPeople();
        S.groups = (await API.get('/groups')).groups || [];
        render();
      });
    });
}
function editPersonModal(){
  var p = S.openPerson;
  showModal('Edit ' + p.name,
    '<div class="field"><div class="lbl">Name</div><input type="text" id="fName" value="' + esc(p.name) + '"></div>' +
    '<div class="two"><div class="field"><div class="lbl">Mobile</div><input type="tel" id="fPhone" value="' + esc(p.phone || '') + '"></div>' +
    '<div class="field"><div class="lbl">Email</div><input type="email" id="fEmail" value="' + esc(p.email || '') + '"></div></div>',
    'Save', function(){
      guard(async function(){
        await API.patch('/people/' + p.id, {
          name: document.getElementById('fName').value,
          phone: document.getElementById('fPhone').value,
          email: document.getElementById('fEmail').value
        });
        S.openPerson = await API.get('/people/' + p.id);
        closeModal(); toast('Saved'); render();
      });
    });
}
function keywordModal(){
  var groupOpts = '<option value="">Do not add to a list</option>' +
    S.groups.map(function(g){
      return '<option value="' + g.id + '">' + esc(g.name) + '</option>'; }).join('');
  showModal('New keyword',
    '<div class="two"><div class="field"><div class="lbl">Keyword</div>' +
    '<input type="text" id="kWord" placeholder="JOIN" maxlength="20"></div>' +
    '<div class="field"><div class="lbl">Add them to</div>' +
    '<select id="kGroup">' + groupOpts + '</select></div></div>' +
    '<div class="field"><div class="lbl">Auto-reply <span class="hint">sent instantly</span></div>' +
    '<textarea id="kReply" rows="3" placeholder="You are on the list - welcome!"></textarea></div>' +
    '<div class="lbl">Follow-up sequence <span class="hint">optional</span></div>' +
    [1, 2].map(function(i){
      return '<div class="two" style="margin-bottom:8px">' +
        '<div class="field" style="margin:0"><div class="lbl">Step ' + i + ' after</div>' +
        '<select id="kDelay' + i + '"><option value="0">immediately</option>' +
        '<option value="60">1 hour</option><option value="1440">1 day</option>' +
        '<option value="4320">3 days</option><option value="10080">1 week</option></select></div>' +
        '<div class="field" style="margin:0"><div class="lbl">Message</div>' +
        '<input type="text" id="kBody' + i + '" placeholder="(leave blank to skip)"></div></div>';
    }).join('') +
    '<div class="note"><span class="i">i</span><span>STOP, HELP and START are reserved by ' +
    'the carriers. Personalise with <code>{{first_name}}</code>.</span></div>',
    'Create keyword', function(){
      var steps = [];
      [1, 2].forEach(function(i){
        var b = (document.getElementById('kBody' + i).value || '').trim();
        if(b) steps.push({delay_minutes: +document.getElementById('kDelay' + i).value, body: b});
      });
      guard(async function(){
        await API.post('/keywords', {
          word: document.getElementById('kWord').value,
          reply: document.getElementById('kReply').value,
          group_id: document.getElementById('kGroup').value || null,
          steps: steps
        });
        closeModal();
        S.keywords = (await API.get('/keywords')).keywords || [];
        toast('Keyword created'); render();
      });
    });
}

function pollModal(){
  showModal('New poll',
    '<div class="field"><div class="lbl">Question</div>' +
    '<input type="text" id="pQ" placeholder="Which night suits you best?"></div>' +
    '<div class="field"><div class="lbl">Options <span class="hint">one per line, 2 to 10</span></div>' +
    '<textarea id="pOpts" rows="4" placeholder="Tuesday&#10;Wednesday&#10;Thursday"></textarea></div>' +
    '<div class="field"><div class="lbl">Send to</div><select id="pGroup">' +
    S.groups.map(function(g){
      return '<option value="' + g.id + '">' + esc(g.name) + ' (' + n(g.count) + ')</option>';
    }).join('') + '</select></div>' +
    '<div class="note"><span class="i">i</span><span>Goes out as a numbered list ending ' +
    '&ldquo;Reply with a number&rdquo;. Costs one credit per recipient like any text.</span></div>',
    'Send poll', function(){
      var opts = (document.getElementById('pOpts').value || '')
        .split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
      var gid = document.getElementById('pGroup').value;
      var g = S.groups.filter(function(x){ return String(x.id) === gid; })[0];
      guard(async function(){
        await API.post('/polls', {
          question: document.getElementById('pQ').value,
          options: opts,
          audience: [{kind: 'group', id: +gid, name: g ? g.name : '', count: g ? g.count : 0}]
        });
        closeModal();
        S.polls = (await API.get('/polls')).polls || [];
        S.cfg = await API.get('/bootstrap');
        toast('Poll sent'); render();
      });
    });
}

function templateModal(tpl){
  var cats = S.templateCats.slice();
  ['Announcements','Emergency','Pastoral','Volunteers','Worship','Youth'].forEach(function(c){
    if(cats.indexOf(c) === -1) cats.push(c);
  });
  showModal(tpl ? 'Edit template' : 'New template',
    '<div class="field"><div class="lbl">Name</div><input type="text" id="tName" value="' +
    esc(tpl ? tpl.name : '') + '" placeholder="e.g. Service cancelled"></div>' +
    '<div class="field"><div class="lbl">Category</div><select id="tCat">' +
    '<option value="">Uncategorised</option>' +
    cats.map(function(c){
      return '<option' + (tpl && tpl.category === c ? ' selected' : '') + '>' + esc(c) + '</option>';
    }).join('') + '</select></div>' +
    '<div class="field"><div class="lbl">Message</div><textarea id="tBody" rows="5">' +
    esc(tpl ? tpl.body : '') + '</textarea></div>' +
    '<div class="note"><span class="i">i</span><span>Personalise with ' +
    (S.mergeFields.length ? S.mergeFields : ['first_name','last_name','full_name'])
      .map(function(f){ return '<code>{{' + f + '}}</code>'; }).join(', ') +
    '. Anything else is rejected rather than sent out blank.</span></div>',
    tpl ? 'Save' : 'Create', function(){
      var body = {
        name: document.getElementById('tName').value,
        category: document.getElementById('tCat').value,
        body: document.getElementById('tBody').value
      };
      guard(async function(){
        if(tpl) await API.patch('/templates/' + tpl.id, body);
        else await API.post('/templates', body);
        closeModal();
        var tr = await API.get('/templates');
        S.templates = tr.templates || []; S.templateCats = tr.categories || [];
        S.mergeFields = tr.mergeFields || S.mergeFields;
        toast(tpl ? 'Template saved' : 'Template created');
        render();
      });
    });
}

function addGroupModal(){
  showModal('Create a group',
    '<div class="field"><div class="lbl">Name</div><input type="text" id="gName" placeholder="e.g. Prayer Chain"></div>' +
    '<div class="field"><div class="lbl">Type</div><select id="gType">' +
    ['Campus','Ministry','Small Group','Serving Team','Custom'].map(function(x){
      return '<option' + (x === 'Custom' ? ' selected' : '') + '>' + x + '</option>'; }).join('') +
    '</select></div>', 'Create', function(){
      guard(async function(){
        await API.post('/groups', {name: document.getElementById('gName').value,
                                   type: document.getElementById('gType').value});
        closeModal(); toast('Group created');
        S.groups = (await API.get('/groups')).groups || [];
        render();
      });
    });
}
function renameGroupModal(){
  var g = S.openGroup;
  showModal('Rename group',
    '<div class="field"><div class="lbl">Name</div><input type="text" id="gName" value="' + esc(g.name) + '"></div>',
    'Save', function(){
      guard(async function(){
        await API.patch('/groups/' + g.id, {name: document.getElementById('gName').value});
        S.openGroup = await API.get('/groups/' + g.id);
        closeModal(); toast('Renamed'); render();
      });
    });
}
function deleteGroupModal(){
  var g = S.openGroup;
  showModal('Delete “' + g.name + '”?',
    '<p style="margin:0;color:var(--ink-2);font-size:13px">The group is removed from the ' +
    'list and can no longer be messaged. The ' + n(g.count) + ' people in it are <b>not</b> deleted ' +
    'and stay in every other group they belong to.</p>',
    'Delete group', function(){
      guard(async function(){
        await API.del('/groups/' + g.id);
        closeModal(); S.openGroup = null;
        S.groups = (await API.get('/groups')).groups || [];
        toast('Group deleted'); render();
      });
    });
}

window.addEventListener('message', BRIDGE.onMessage);
window.addEventListener('resize', function(){ BRIDGE.measure(); });
if(window.ResizeObserver)
  new ResizeObserver(function(){ fitNav(); BRIDGE.measure(); })
    .observe(document.getElementById('root'));

try { parent.postMessage({source:'hgs-comms', type:'frameLoaded', payload:{}}, '*'); } catch(e){}
// If no host handshake arrives, boot anyway with defaults. A bare <iframe> with
// no SDK is the simplest possible integration and must work; when the SDK is
// present it answers within a few milliseconds, so this grace period never
// fires first. Also covers the file being opened directly for review.
setTimeout(function(){
  if(!S.booted && !S.host) BRIDGE.init({});
}, 600);

})();
